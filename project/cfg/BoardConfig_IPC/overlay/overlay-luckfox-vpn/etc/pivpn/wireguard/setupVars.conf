# Non-secret WireGuard server settings, read by S48wireguard and pivpn.
# Keys are generated on first boot and live on /userdata/wireguard.
IPv4dev=eth0
pivpnDEV=wg0
pivpnPORT=51820
pivpnHOST=psykey.webhop.me
# Only /24 networks are supported (server = .1, clients = .2 - .254)
pivpnNET=10.6.0.0
subnetClass=24
pivpnDNS1=9.9.9.9
pivpnDNS2=149.112.112.112
# ::/0 blackholes client IPv6 -> no IPv6 leak (IPv6-only sites won't work)
ALLOWED_IPS="0.0.0.0/0, ::/0"
pivpnMTU=1420
pivpnPERSISTENTKEEPALIVE=25
BACKUP_DIR=/userdata/vpn-backup
