# dhcpcd configuration for the Luckfox VPN server (based on the Buildroot default)

# Send the MAC address as client-id so a router reservation by MAC is reliable
clientid
# Disabled: a DUID-based client-id breaks MAC-based reservations
#duid

# The tunnel and the USB rescue interface must not be touched by dhcpcd
denyinterfaces wg* usb0

# Send the hostname (luckfox-vpn) to the router
hostname

# Persist interface configuration when dhcpcd exits.
persistent

vendorclassid

option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
option rapid_commit

require dhcp_server_identifier

slaac private
